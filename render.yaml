services:
  - type: web
    name: open-casting
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    # ponytail: free plan has no preDeployCommand; one instance, so init before serve cannot race. Move back to preDeployCommand on a paid plan.
    dockerCommand: /bin/sh -c python -m app.db init && exec python -m app.serve
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: open-casting-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: open-casting-cache
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STUDIO_PASSWORD_HASH
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_IP_HEADER
        value: True-Client-IP
      - key: SEED_DEMO
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
  - type: keyvalue
    name: open-casting-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
databases:
  - name: open-casting-db
    region: singapore
    plan: free
    postgresMajorVersion: "18"
    ipAllowList: []
